<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Anime Gamez</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

:root { font-family: "DM Sans", sans-serif; color:#f5f4f2; background:#08090d; font-synthesis:none; }
* { box-sizing:border-box; }
body { margin:0; min-width:320px; background:
  radial-gradient(circle at 70% -10%, rgba(221,65,93,.16), transparent 32rem),
  radial-gradient(circle at 10% 25%, rgba(111,66,193,.12), transparent 26rem), #08090d; }
button,input { font:inherit; }
button { cursor:pointer; }
.page { width:min(1180px, calc(100% - 32px)); margin:auto; padding:54px 0 80px; }
.hero { padding:48px 0 36px; }
.hero.compact { text-align:center; }
.eyebrow { letter-spacing:.22em; font-size:.72rem; font-weight:800; color:#ef5774; }
.hero h1 { font-family:Manrope,sans-serif; margin:12px 0 14px; font-size:clamp(2.8rem,7vw,6.6rem); line-height:.94; letter-spacing:-.06em; }
.hero h1 em { color:#ef5774; font-style:normal; }
.hero p,.section-title p { color:#9498a4; margin:0; }
.panel { border:1px solid #242630; background:rgba(14,15,21,.86); border-radius:20px; padding:24px; margin:18px 0; backdrop-filter:blur(14px); }
.section-title { display:flex; gap:14px; align-items:center; margin-bottom:20px; }
.section-title>b { color:#ef5774; font:800 .78rem Manrope; border:1px solid #5b2633; padding:8px; border-radius:10px; }
.section-title h2 { margin:0 0 4px; font:800 1.2rem Manrope; }
.section-title .ghost { margin-left:auto; }
.input-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.input-row { display:flex; gap:8px; background:#0a0b10; border:1px solid #242630; padding:6px; border-radius:14px; }
input { width:100%; border:0; outline:0; padding:12px 13px; color:#fff; background:transparent; }
.input-row button,.primary,.ghost { border:0; border-radius:10px; padding:11px 15px; color:#fff; background:#252833; font-weight:700; }
.primary { background:#ef5774; margin-top:20px; }
.ghost { background:#161820; color:#b9bdc8; }
.message { color:#b9bdc8; margin:14px 0 0; }
.anime-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; max-height:560px; overflow:auto; padding-right:4px; }
.anime-tile { position:relative; padding:0; overflow:hidden; text-align:left; border:1px solid #292b34; background:#111219; color:#fff; border-radius:14px; min-width:0; }
.anime-tile img,.placeholder { width:100%; aspect-ratio:2/3; object-fit:contain; background:#0d0e13; display:block; background:#20222b; filter:saturate(.8); }
.anime-tile span { display:block; padding:10px; font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.anime-tile i { position:absolute; top:8px; right:8px; width:27px; height:27px; display:grid; place-items:center; border-radius:50%; background:rgba(8,9,13,.82); font-style:normal; }
.anime-tile.active { border-color:#ef5774; box-shadow:0 0 0 1px #ef5774 inset; }
.anime-tile.active i { background:#ef5774; }
.settings { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
label { display:block; color:#969aa5; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; margin-bottom:10px; }
.segmented,.rounds { display:flex; gap:7px; flex-wrap:wrap; }
.segmented button,.rounds button { flex:1; min-width:70px; border:1px solid #2c2e37; color:#b9bdc8; background:#111219; padding:12px; border-radius:11px; }
.segmented .active,.rounds .active { color:#fff; background:#262832; border-color:#ef5774; }
.rounds input { width:92px; border:1px solid #2c2e37; border-radius:11px; background:#111219; }
.launch { margin-top:24px; width:100%; border:0; border-radius:14px; padding:17px; font:800 .9rem Manrope; letter-spacing:.08em; background:#ef5774; color:white; }
.launch:disabled { opacity:.45; cursor:not-allowed; }
.game-shell { min-height:100vh; width:min(520px, calc(100% - 28px)); margin:auto; display:flex; flex-direction:column; justify-content:center; padding:24px 0; }
.progress-row { display:flex; justify-content:space-between; align-items:center; font-size:.8rem; letter-spacing:.08em; }
.progress-row span { color:#ef5774; font-weight:800; }
.progress-row b { color:#a9adb8; }
.progress { height:3px; background:#252731; margin:12px 0 18px; border-radius:2px; overflow:hidden; }
.progress i { display:block; height:100%; background:#ef5774; }
.character-card { position:relative; overflow:hidden; min-height:64vh; max-height:720px; border-radius:24px; border:1px solid #292b34; background:#111219; box-shadow:0 24px 80px rgba(0,0,0,.45); }
.character-card img { width:100%; height:100%; min-height:64vh; max-height:720px; object-fit:contain; object-position:center; display:block; background:#0d0e13; }
.shade { position:absolute; inset:40% 0 0; background:linear-gradient(transparent,rgba(5,5,8,.95)); }
.character-meta { position:absolute; left:24px; right:24px; bottom:22px; }
.character-meta small { color:#ef8da0; font-weight:700; }
.character-meta h1 { margin:4px 0 0; font:800 clamp(2rem,8vw,3.4rem) Manrope; line-height:1; letter-spacing:-.045em; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.actions button { border-radius:15px; padding:16px; border:1px solid; font-weight:800; letter-spacing:.08em; }
.actions span { font-size:1.15rem; margin-right:7px; }
.pass { color:#c9ccd5; background:#12131a; border-color:#353843!important; }
.smash { color:white; background:#ef5774; border-color:#ef5774!important; }
.hint { color:#626673; text-align:center; font-size:.76rem; }
.result-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.result-grid article { display:flex; gap:10px; align-items:center; background:#111219; border:1px solid #252731; border-radius:12px; padding:8px; min-width:0; }
.result-grid img { width:52px; height:68px; object-fit:contain; background:#0d0e13; border-radius:8px; }
.result-grid div { min-width:0; }
.result-grid b,.result-grid span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.result-grid span { color:#777b87; font-size:.75rem; margin-top:3px; }

@media (max-width:850px) {
  .anime-grid { grid-template-columns:repeat(4,1fr); }
  .input-grid,.settings { grid-template-columns:1fr; }
  .result-grid { grid-template-columns:repeat(2,1fr); }
}
@media (max-width:540px) {
  .page { width:min(100% - 20px,1180px); padding-top:20px; }
  .hero { padding-top:24px; }
  .panel { padding:16px; border-radius:16px; }
  .anime-grid { grid-template-columns:repeat(3,1fr); }
  .input-row { flex-direction:column; }
  .section-title { align-items:flex-start; }
  .section-title .ghost { font-size:.72rem; padding:8px; }
  .character-card,.character-card img { min-height:62vh; }
}

async function fetchWithRetry(url,tries=2,timeoutMs=API_TIMEOUT){

  try{
   const r=await fetch(url,{signal:controller.signal});
   clearTimeout(timer);
   if(r.ok)return r;
   last=Object.assign(new Error("HTTP "+r.status),{status:r.status});
   if(![429,500,502,503,504].includes(r.status))throw last;
  }catch(raw){
   clearTimeout(timer);
   const e=raw?.name==="AbortError"?Object.assign(new Error("Zeitüberschreitung"),{code:"TIMEOUT"}):raw;
   if(e?.status&&![429,500,502,503,504].includes(e.status))throw e;
   last=e;
  }

}

function relevance(c){return (c.role==="MAIN"?1000000:c.role==="SUPPORTING"?100000:0)+Math.min(c.favourites,99999)}
function buildPool(chars,gender,limit=10){
 const target=gender==="MALE"?"Male":gender==="FEMALE"?"Female":null;
 const filtered=chars.filter(c=>target?c.gender===target:true).sort((a,b)=>relevance(b)-relevance(a));
 if(gender!=="BOTH")return filtered.slice(0,limit);
 const male=filtered.filter(c=>c.gender==="Male"),female=filtered.filter(c=>c.gender==="Female"),other=filtered.filter(c=>c.gender!=="Male"&&c.gender!=="Female"),a=Math.ceil(limit/2),b=Math.floor(limit/2);
 const o1=[...male.slice(0,a),...female.slice(0,b)],o2=[...female.slice(0,a),...male.slice(0,b)];
 const score=x=>x.reduce((s,c)=>s+relevance(c),0);let picked=score(o1)>=score(o2)?o1:o2;

}
function shuffle(x){x=[...x];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function createSession(pools,rounds){

  let ids=[...working.keys()].filter(id=>(working.get(id)?.length||0)>0);
  if(!ids.length){for(const [id,p]of pools)working.set(id,shuffle(p));ids=[...working.keys()].filter(id=>working.get(id).length)}
  ids.sort((a,b)=>(usage.get(a)||0)-(usage.get(b)||0));const min=usage.get(ids[0])||0;
  let cand=ids.filter(id=>(usage.get(id)||0)<=min+1);if(cand.length>1&&lastAnime!==null)cand=cand.filter(id=>id!==lastAnime);

function createVsSession(pools,size){
 const all=shuffle([...pools.values()].flat());
 if(all.length<2)throw new Error("Für VS werden mindestens 2 passende Charaktere benötigt.");
 const requested=Math.max(2,Math.min(Number(size)||10,all.length));
 const usable=requested-requested%2;
 const selected=all.slice(0,usable),pairs=[];
 for(let i=0;i<selected.length;i+=2)pairs.push({a:selected[i],b:selected[i+1],winner:null,loser:null});

}
function chooseVs(id){

 const winner=pair.a.id===id?pair.a:pair.b,loser=pair.a.id===id?pair.b:pair.a;

function createKmmSession(pools,rounds){
 const all=[...pools.values()].flat();
 if(all.length<3)throw new Error("Für Kiss Marry Kill werden mindestens 3 passende Charaktere benötigt.");
 const out=[]; let deck=shuffle(all), lastIds=new Set();
 for(let r=0;r<rounds;r++){
  if(deck.length<3)deck=shuffle(all);
  let picks=[];
  // Prefer three different anime and avoid previous trio where possible.
  for(const c of deck){
   if(picks.length>=3)break;
   if(lastIds.has(c.id)&&all.length>5)continue;
   if(picks.some(x=>x.id===c.id))continue;
   const sameAnime=picks.some(x=>x.animeIdMal===c.animeIdMal);
   const alternatives=deck.some(x=>!picks.some(y=>y.id===x.id)&&!lastIds.has(x.id)&&!picks.some(y=>y.animeIdMal===x.animeIdMal));
   if(sameAnime&&alternatives)continue;
   picks.push(c);
  }
  if(picks.length<3){
   for(const c of shuffle(all))if(!picks.some(x=>x.id===c.id)){picks.push(c);if(picks.length===3)break}
  }
  const used=new Set(picks.map(x=>x.id));deck=deck.filter(x=>!used.has(x.id));lastIds=used;
  out.push({characters:picks,choices:{}});
 }

}

function createWorldCup(pools,size){
 const all=shuffle([...pools.values()].flat());
 if(all.length<8)throw new Error("Für den Weltmeister-Modus werden mindestens 8 Charaktere benötigt.");
 const target=Math.max(8,Number(size)||16);
 if(target>all.length)throw new Error(`Maximal ${all.length} Teilnehmer möglich.`);
 const entrants=all.slice(0,target);

 // Ziel: möglichst gleich große Gruppen mit 4–6 Charakteren.
 // Dadurch funktionieren auch ungerade Teilnehmerzahlen sauber.
 let groupCount=Math.max(2,Math.round(target/4));
 while(Math.ceil(target/groupCount)>6)groupCount++;
 while(groupCount>2&&Math.floor(target/groupCount)<4)groupCount--;

 const base=Math.floor(target/groupCount),extra=target%groupCount;
 const groups=Array.from({length:groupCount},(_,i)=>({
  name:String.fromCharCode(65+i),
  players:[],
  targetSize:base+(i<extra?1:0),
  matches:[],
  table:{},
  resolvedTop2:null
 }));

 let cursor=0;
 for(const g of groups){
  g.players=entrants.slice(cursor,cursor+g.targetSize);
  cursor+=g.targetSize;
 }
 for(const g of groups){
  for(const p of g.players)g.table[p.id]={character:p,played:0,wins:0,losses:0,points:0};
  for(let i=0;i<g.players.length;i++)for(let j=i+1;j<g.players.length;j++)g.matches.push({a:g.players[i],b:g.players[j],winner:null});
 }
 return {
  stage:"groups",groups,currentGroup:0,currentMatch:0,tiebreak:null,
  qualifiers:[],knockout:null,thirdPlace:null,finalists:null,
  winner:null,runnerUp:null,third:null,fourth:null,initialSize:target,qualifiersPerGroup:Math.max(1,Math.min(state.wcQualifiers,Math.min(...groups.map(g=>g.players.length-1))))
 };
}
function groupSortedRows(group){
 return Object.values(group.table).sort((a,b)=>b.points-a.points||b.wins-a.wins||a.character.name.localeCompare(b.character.name));
}
function prepareGroupResolution(w,groupIndex){
 const g=w.groups[groupIndex],rows=groupSortedRows(g),q=Math.min(w.qualifiersPerGroup,rows.length);
 if(rows.length<=q){g.resolvedTop2=rows.map(x=>x.character);return false}
 const cutoff=rows[q-1].points;
 const tied=rows.filter(x=>x.points===cutoff);
 const locked=rows.filter(x=>x.points>cutoff).map(x=>x.character);
 const slots=q-locked.length;
 if(tied.length<=slots){g.resolvedTop2=[...locked,...tied.map(x=>x.character)].slice(0,q);return false}
 w.tiebreak={groupIndex,candidates:tied.map(x=>x.character),selected:[],slots,locked};
 w.stage="group_tiebreak";
 return true;
}

function nextPowerOfTwo(n){
 return 2**Math.ceil(Math.log2(Math.max(2,n)));
}
function buildWorldCupKnockout(){
 const w=state.worldCup,seedRows=[];
 for(const g of w.groups){
  (g.resolvedTop2||[]).forEach((character,i)=>seedRows.push({character,group:g.name,seed:i+1}));
 }
 const unique=[],ids=new Set();
 for(const x of seedRows.sort((a,b)=>a.seed-b.seed)){
  if(!ids.has(x.character.id)){ids.add(x.character.id);unique.push(x)}
 }
 const bracketSize=nextPowerOfTwo(unique.length),slots=Array(bracketSize).fill(null);
 for(let i=0;i<unique.length;i++){
  const pos=Math.floor(i*bracketSize/unique.length);let p=pos;
  while(slots[p])p=(p+1)%bracketSize;slots[p]=unique[i];
 }
 for(let i=0;i<bracketSize;i+=2){
  const a=slots[i],b=slots[i+1];
  const conflict=a&&b&&(a.group===b.group||(state.wcAnimeSeeding&&a.character.animeTitle===b.character.animeTitle));
  if(conflict){
   const swap=slots.findIndex((x,j)=>j>i+1&&x&&x.group!==a.group&&(!state.wcAnimeSeeding||x.character.animeTitle!==a.character.animeTitle));
   if(swap>0)[slots[i+1],slots[swap]]=[slots[swap],slots[i+1]];
  }
 }
 w.qualifiers=unique.map(x=>x.character);
 const knockoutSlots=slots.map(x=>x?.character||null);
 w.knockout={slots:knockoutSlots,initialSlots:[...knockoutSlots],initialRoundSize:bracketSize,roundSlots:{[bracketSize]:[...knockoutSlots]},roundSize:bracketSize,history:[],semifinalLosers:[],currentPairIndex:0,nextSlots:[]};
 w.stage="knockout";processWorldCupByes();autoSaveWorldCup();
}
function processWorldCupByes(){
 const t=state.worldCup?.knockout;if(!t)return;
 while(t.currentPairIndex<t.slots.length){
  const a=t.slots[t.currentPairIndex],b=t.slots[t.currentPairIndex+1];
  if(a&&b)break;
  if(a||b)t.nextSlots.push(a||b);
  t.currentPairIndex+=2;
 }
 if(t.currentPairIndex>=t.slots.length)advanceWorldCupKnockoutRound();
}
function advanceWorldCupKnockoutRound(){
 const w=state.worldCup,t=w.knockout;
 if(t.roundSize===4){
  w.finalists=[...t.nextSlots];
  w.thirdPlace=[...t.semifinalLosers];
  w.stage="third_place";
  return;
 }
 t.slots=[...t.nextSlots];
 t.nextSlots=[];
 t.roundSize=t.slots.length;
 t.roundSlots=t.roundSlots||{};
 t.roundSlots[t.roundSize]=[...t.slots];
 t.currentPairIndex=0;
 processWorldCupByes();
}

function wcTreeData(w){
 const t=w?.knockout;
 if(!t)return {size:32,rounds:{},history:{},current:null};
 const size=Math.min(32,t.initialRoundSize||t.initialSlots?.length||Math.max(t.roundSize||2,2));
 const rounds={};
 if(t.roundSlots)for(const [k,v] of Object.entries(t.roundSlots))rounds[Number(k)]=v;
 if(!rounds[size]&&t.initialSlots)rounds[size]=t.initialSlots;
 if(!rounds[t.roundSize])rounds[t.roundSize]=t.slots;
 // Zeige die bereits feststehenden Paarungen der nächsten Runde sofort an.
 // t.nextSlots enthält die Gewinner der aktuell laufenden Runde in Baum-Reihenfolge.
 // Vorher wurde roundSlots erst nach Abschluss der kompletten Runde gesetzt, wodurch
 // z. B. das erste Achtelfinale trotz zweier feststehender Teilnehmer noch „offen“ blieb.
 if(w.stage==="knockout"&&t.roundSize>2&&Array.isArray(t.nextSlots)&&t.nextSlots.length){
  const nextSize=t.roundSize/2;
  const preview=Array(nextSize).fill(null);
  t.nextSlots.slice(0,nextSize).forEach((character,index)=>preview[index]=character||null);
  const stored=rounds[nextSize]||[];
  for(let i=0;i<Math.min(stored.length,nextSize);i++)if(stored[i])preview[i]=stored[i];
  rounds[nextSize]=preview;
 }
 const history={};
 for(const h of t.history||[]){
  const rs=Math.min(32,h.roundSize);
  (history[rs]||(history[rs]=[])).push(h);
 }
 return {size,rounds,history,current:w.stage==="knockout"?{size:t.roundSize,index:Math.floor(t.currentPairIndex/2)}:null};
}
function renderWorldCupTree(w){
 const d=wcTreeData(w), W=1180,H=310,cx=W/2, top=28,bottom=292;
 const stages=[32,16,8,4,2];
 const leftX={32:70,16:210,8:340,4:455,2:535};
 const rightX={32:1110,16:970,8:840,4:725,2:645};
 const nodes=[],paths=[],labels=[];
 function yFor(sideCount,index){return top+(bottom-top)*(index+.5)/sideCount}
 function nodeInfo(size,matchIndex){
  const arr=d.rounds[size]||[];
  const a=arr[matchIndex*2]||null,b=arr[matchIndex*2+1]||null;
  const hist=(d.history[size]||[])[matchIndex];
  return {a,b,winner:hist?.winner||null,done:!!hist};
 }
 for(const size of stages){
  const totalMatches=size/2, perSide=Math.max(1,totalMatches/2);
  if(size>d.size)continue;
  const label=size===32?"Letzte 32":worldCupRoundLabel(size);
  labels.push(`<span class="wc-tree-label" style="left:${leftX[size]/W*100}%">${label}</span>`,`<span class="wc-tree-label" style="left:${rightX[size]/W*100}%">${label}</span>`);
  for(let side=0;side<2;side++){
   for(let i=0;i<perSide;i++){
    const matchIndex=side===0?i:perSide+i;
    const x=side===0?leftX[size]:rightX[size], y=yFor(perSide,i);
    const inf=nodeInfo(size,matchIndex);
    const current=!!d.current&&d.current.size===size&&d.current.index===matchIndex;
    nodes.push(`<div class="wc-node ${current?"current":""} ${inf.done?"done":""} ${size===2?"final-node":""}" style="left:${x/W*100}%;top:${y/H*100}%">${wcTreePerson(inf.a,inf.winner?.id)}${wcTreePerson(inf.b,inf.winner?.id)}</div>`);
    if(current)nodes.push(`<i class="wc-current-dot" style="left:${(x+(side===0?-64:64))/W*100}%;top:${y/H*100}%" title="Du bist hier"></i>`);
    if(size>2){
     const nextSize=size/2,nextI=Math.floor(i/2),nx=side===0?leftX[nextSize]:rightX[nextSize],ny=yFor(Math.max(1,perSide/2),nextI);

function chooseTournament(id){

}

    let raw;try{raw=await getCharacterPool(anime)}catch(e){failed.push(anime.title);state.loadingQuality.failed=failed.length;console.warn("Anime beim Spielstart übersprungen:",anime.title,e);continue}

   app.innerHTML=`<main class="page"><header class="hero compact"><span class="eyebrow">BLIND RANKING COMPLETE</span><h1>Your <em>Ranking</em></h1><div class="result-actions"><button class="primary" onclick="repeatSession()">↻ Wiederholen</button><button class="primary secondary" onclick="state.screen='setup';render()">Einstellungen</button></div></header><section class="panel"><div class="ranking-list">${ranked.map(c=>`<article><strong>#${c.rank}</strong><img src="${esc(c.image)}"><div><b>${esc(c.name)}</b><span>${esc(c.animeTitle)}</span></div><button class="fav-btn ${state.favorites.has(c.id)?"active":""}" onclick="toggleFavorite(${c.id})">★</button><button class="lock-btn ${state.locked.has(c.id)?"active":""}" onclick="toggleLock(${c.id})">${state.locked.has(c.id)?"🔒":"🔓"}</button></article>`).join("")}</div></section></main>`;return;
  }
  if(state.mode==="worldcup"){
   const w=state.worldCup;
   const podium=[w.winner,w.runnerUp,w.third,w.fourth].filter(Boolean);
   app.innerHTML=`<main class="page"><header class="hero compact wc-hero"><span class="eyebrow">WELTMEISTERSCHAFT BEENDET</span><h1>World <em>Champion</em></h1></header><section class="podium">${podium.slice(0,3).map((c,i)=>`<article class="podium-${i+1}"><span>#${i+1}</span><img src="${esc(c.image)}"><h2>${esc(c.name)}</h2><p>${esc(c.animeTitle)}</p></article>`).join("")}</section><section class="panel"><div class="ranking-list">${podium.map((c,i)=>`<article><strong>#${i+1}</strong><img src="${esc(c.image)}"><div><b>${esc(c.name)}</b><span>${esc(c.animeTitle)}</span></div></article>`).join("")}</div><div class="result-actions"><button class="primary" onclick="repeatSession()">↻ Wiederholen</button><button class="primary secondary" onclick="state.screen='setup';render()">Einstellungen</button></div></section></main>`;return;
  }
  if(state.mode==="vs"){
   const v=state.vsSession;if(!v?.pairs?.length){state.screen="setup";render();return}const winners=v.pairs.filter(x=>x.winner).map(x=>x.winner),losers=v.pairs.filter(x=>x.loser).map(x=>x.loser);
   app.innerHTML=`<main class="page"><header class="hero compact"><span class="eyebrow">VS SESSION COMPLETE</span><h1>${v.pairs.length} <em>Duelle</em></h1><p>Jeder Charakter ist genau einmal vorgekommen.</p><div class="result-actions"><button class="primary" onclick="repeatSession()">↻ Wiederholen</button><button class="primary secondary" onclick="state.screen='setup';render()">Einstellungen</button></div></header>${resultSection("Sieger",winners)}${resultSection("Unterlegen",losers)}</main>`;return;
  }
  if(state.mode==="tournament"){
   const w=state.tournament?.winner;
   const ranked=[...state.tournament.placements].sort((a,b)=>{
    if(a.eliminatedRound===Infinity)return -1;
    if(b.eliminatedRound===Infinity)return 1;
    return b.eliminatedRound-a.eliminatedRound;
   });
   app.innerHTML=`<main class="page"><header class="hero compact"><span class="eyebrow">TOURNAMENT WINNER</span><h1>The <em>Champion</em></h1><div class="winner-card"><img src="${esc(w.image)}"><h2>${esc(w.name)}</h2><p>${esc(w.animeTitle)}</p><div><button class="fav-btn ${state.favorites.has(w.id)?"active":""}" onclick="toggleFavorite(${w.id})">★ Favorit</button><button class="lock-btn ${state.locked.has(w.id)?"active":""}" onclick="toggleLock(${w.id})">${state.locked.has(w.id)?"🔒":"🔓"} Sperren</button></div></div><div class="result-actions"><button class="primary" onclick="repeatSession()">↻ Wiederholen</button><button class="primary secondary" onclick="state.screen='setup';render()">Einstellungen</button></div></header><section class="panel"><div class="section-title"><div><h2>Platzierungen</h2><p>Sortiert nach erreichter K.-o.-Runde.</p></div></div><div class="ranking-list">${ranked.map((x,i)=>`<article><strong>#${i+1}</strong><img src="${esc(x.character.image)}"><div><b>${esc(x.character.name)}</b><span>${esc(x.character.animeTitle)} · ${x.eliminatedRound===Infinity?"Sieger":`Aus in Runde ${x.eliminatedRound}`}</span></div><button class="fav-btn ${state.favorites.has(x.character.id)?"active":""}" onclick="toggleFavorite(${x.character.id})">★</button><button class="lock-btn ${state.locked.has(x.character.id)?"active":""}" onclick="toggleLock(${x.character.id})">${state.locked.has(x.character.id)?"🔒":"🔓"}</button></article>`).join("")}</div></section></main>`;return;
  }
  if(state.mode==="kmm"){
   const groups={kiss:[],marry:[],kill:[]};
   for(const r of state.rounds)for(const c of r.characters){const ch=r.choices[c.id];if(ch)groups[ch].push(c)}
   app.innerHTML=`<main class="page"><header class="hero compact"><span class="eyebrow">SESSION COMPLETE</span><h1>Kiss · Marry · <em>Kill</em></h1><p>${state.rounds.length} Runden gespielt</p><div class="result-actions"><button class="primary" onclick="repeatSession()">↻ Wiederholen</button><button class="primary secondary" onclick="state.screen='setup';render()">Einstellungen</button></div></header>${resultSection("💋 Kiss",groups.kiss)}${resultSection("💍 Marry",groups.marry)}${resultSection("☠ Kill",groups.kill)}</main>`;
   return;
  }
  const smash=state.rounds.filter(r=>r.decision==="smash"),pass=state.rounds.filter(r=>r.decision==="pass"),pct=state.rounds.length?Math.round(smash.length/state.rounds.length*100):0;
  app.innerHTML=`<main class="page"><header class="hero compact"><span class="eyebrow">SESSION COMPLETE</span><h1>${pct}% <em>Smash</em></h1><p>${smash.length} Smash · ${pass.length} Pass · ${state.rounds.length} Runden</p><div class="result-actions"><button class="primary" onclick="repeatSession()">↻ Wiederholen</button><button class="primary secondary" onclick="state.screen='setup';render()">Einstellungen</button></div></header>${resultSection("Smash",smash)}${resultSection("Pass",pass)}</main>`;return;
 }
 app.innerHTML=renderSetupV65();if(state.previewAnime)setTimeout(renderPreview,0);return;

}
window.addEventListener("error",e=>{const img=e.target;if(img?.tagName==="IMG"&&!img.dataset.fallbackApplied){img.dataset.fallbackApplied="1";img.classList.add("image-fallback");img.src=NO_IMAGE}},true);
window.addEventListener("keydown",e=>{if(state.screen==="game"&&state.mode==="smash"){if(e.key==="ArrowLeft")decide("pass");if(e.key==="ArrowRight")decide("smash")}});
render();

// ===== Anime Gamez V6.4 global loading system =====
let __loaderDepth=0,__loaderShownAt=0,__loaderTimer=null;
function ensureGlobalLoader(){
 if(document.getElementById('globalLoader'))return;
 const el=document.createElement('div');el.id='globalLoader';
 el.innerHTML=`<div class="global-loader-card"><img class="global-loader-logo" src="${APP_LOGO}" alt="Anime Gamez"><div class="global-loader-spinner"></div><h2 id="globalLoaderTitle">Anime Gamez lädt</h2><p id="globalLoaderText">Bitte einen Moment …</p><span class="global-loader-quality" id="globalLoaderQuality">Datenquelle wird geprüft</span><div class="global-loader-bar"><i></i></div></div>`;
 document.body.appendChild(el);
}
function showGlobalLoading(text='Bitte einen Moment …',title='Anime Gamez lädt'){
 ensureGlobalLoader();clearTimeout(__loaderTimer);__loaderDepth++;__loaderShownAt=Date.now();
 document.getElementById('globalLoaderTitle').textContent=title;document.getElementById('globalLoaderText').textContent=text;
 requestAnimationFrame(()=>document.getElementById('globalLoader').classList.add('show'));
}
function updateGlobalLoading(text,quality="loading"){const e=document.getElementById('globalLoaderText'),q=document.getElementById('globalLoaderQuality');if(e)e.textContent=text;if(q)q.textContent=quality==="partial"?(state.language==="de"?"Teilweise verfügbar":"Partially available"):quality==="download"?(state.language==="de"?"Manueller Offline-Download":"Manual offline download"):state.language==="de"?"Online · Cache · Offline-Fallback":"Online · cache · offline fallback"}
function hideGlobalLoading(force=false){
 __loaderDepth=force?0:Math.max(0,__loaderDepth-1);if(__loaderDepth>0)return;
 const wait=Math.max(0,500-(Date.now()-__loaderShownAt));clearTimeout(__loaderTimer);__loaderTimer=setTimeout(()=>{const e=document.getElementById('globalLoader');if(e)e.classList.remove('show')},wait);
}
const __nativeFetch=window.fetch.bind(window);
window.fetch=async(...args)=>{showGlobalLoading('Daten und Charaktere werden geladen …');try{return await __nativeFetch(...args)}finally{hideGlobalLoading()}};
window.addEventListener('DOMContentLoaded',()=>{showGlobalLoading('App wird initialisiert …','Anime Gamez');setTimeout(()=>hideGlobalLoading(true),650)});

</script>
